<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>House Price Predictor</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <div class="country-switch">
    <a href="#" class="active">🇳🇵 Nepal (Kathmandu)</a>
    <a href="aus.html">🇦🇺 Australia</a>
  </div>

  <h1>House Price Predictor</h1>
  <p class="subtitle">Estimate house prices across the Kathmandu Valley</p>

  <label for="size">Land size (in Aana)</label>
  <input type="number" id="size" placeholder="e.g. 6.5" step="0.1" min="0">

  <label for="floors">Number of floors</label>
  <input type="number" id="floors" placeholder="e.g. 2" step="0.5" min="0">

  <label for="age">House age (years)</label>
  <input type="number" id="age" placeholder="e.g. 5" step="1" min="0">

  <label for="location">Location</label>
  <select id="location">
    <option value="Baluwatar">Baluwatar</option>
    <option value="Baneshwor">Baneshwor</option>
    <option value="Bhaktapur">Bhaktapur</option>
    <option value="Boudha">Boudha</option>
    <option value="Budhanilkantha">Budhanilkantha</option>
    <option value="Chabahil">Chabahil</option>
    <option value="Gongabu">Gongabu</option>
    <option value="Jhamsikhel">Jhamsikhel</option>
    <option value="Kalanki">Kalanki</option>
    <option value="Kalimati">Kalimati</option>
    <option value="Kirtipur">Kirtipur</option>
    <option value="Koteshwor">Koteshwor</option>
    <option value="Lazimpat">Lazimpat</option>
    <option value="Naxal">Naxal</option>
    <option value="New Baneshwor">New Baneshwor</option>
    <option value="Sanepa">Sanepa</option>
  </select>

  <div class="error" id="error">Please fill in all fields with valid values.</div>

  <button id="predictBtn" onclick="predictPrice()">Predict Price</button>

  <div class="result" id="result">
    <p>Estimated price</p>
    <p class="value" id="resultValue">-</p>
  </div>

  <script src="index_script.js"></script>
</body>

</html>
